# The live medium logs straight into a root console on tty1.
#
# Phase 1 acceptance depends on this: scripts/test-qemu.sh asserts that an unattended
# boot reaches an interactive shell under both BIOS and UEFI. From Phase 4 onwards the
# graphical live session takes over and this applies only to the fallback console.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --autologin root --noclear %I 38400 linux
