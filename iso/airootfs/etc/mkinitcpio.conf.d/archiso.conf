# Initramfs configuration for the Obelisk live medium.
#
# WITHOUT THIS FILE THE MEDIUM CANNOT BOOT, and it fails in a way that looks like
# something else entirely. Installing mkinitcpio-archiso only PROVIDES the archiso hook;
# nothing uses it until a HOOKS array names it. With the stock hooks the initramfs comes
# up, finds no root= it understands, and dies around one second of kernel time -- which
# is what happened in CI run #8.
#
# This was lost because scripts/build-iso.sh deliberately does not inherit releng's
# airootfs, to keep Arch branding out of the image. That was right for branding and wrong
# here: the initramfs configuration is mechanism, not branding, and had to be carried
# over rather than dropped.
#
# HOOKS are kept identical to upstream releng for now, including the PXE hooks Obelisk
# does not use, because changing a known-good boot path while diagnosing a boot failure
# is how one bug becomes two. Trimming archiso_pxe_* is a Phase 3 size optimisation with
# its own measurement.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
