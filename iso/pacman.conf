#
# Obelisk build-time pacman configuration.
#
# This file is used by mkarchiso to populate the ISO's root filesystem. It is NOT the
# pacman.conf that ends up on the installed system; that one lives at
# iso/airootfs/etc/pacman.conf.
#
# Repository order is load-bearing. Arch's core and extra come FIRST, and the Obelisk
# repository comes LAST, so an Obelisk package can never shadow an upstream one. This
# is checked by scripts/lint.sh, not left to convention.
#
# The Arch repositories are pinned to a dated snapshot on the Arch Linux Archive. See
# decision D2 in docs/ARCHITECTURE.md: this is how Obelisk stays 7-14 days behind Arch
# without operating a mirror. The date is advanced by CI only after a build and smoke
# test pass, and an emergency security fast-track is a one-line change here.
#
# The snapshot date is substituted by scripts/build-iso.sh from OBELISK_ARCHIVE_DATE.
# The token below is replaced at build time; it is not a URL you can fetch as-is.

[options]
HoldPkg          = pacman glibc
Architecture     = auto
CheckSpace
ParallelDownloads = 5
SigLevel         = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://archive.archlinux.org/repos/@ARCHIVE_DATE_PATH@/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/@ARCHIVE_DATE_PATH@/$repo/os/$arch

[multilib]
Server = https://archive.archlinux.org/repos/@ARCHIVE_DATE_PATH@/$repo/os/$arch

# The Obelisk repository is appended here by scripts/build-iso.sh when a package set
# has been built. It is always LAST. During bootstrap, when no Obelisk package exists
# yet, nothing is appended and the build proceeds from Arch alone — see docs/BUILDING.md.
