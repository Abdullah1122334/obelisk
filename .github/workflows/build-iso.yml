name: build-iso

# Obelisk is developed on Windows and cannot be built there: mkarchiso needs an Arch
# host, root, and loop devices. This workflow is therefore not a convenience, it is the
# reference build path. See docs/ARCHITECTURE.md section 2.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: the checks that are cheap and catch the failures that cost the most.
  # ---------------------------------------------------------------------------
  lint:
    name: line endings and shell lint
    runs-on: ubuntu-latest
    # Observed: 11s. Anything approaching this cap is a hang, not slow linting.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # This runs before anything else on purpose. A CRLF that reaches Linux produces
      # "bad interpreter", which points at the interpreter instead of the real cause.
      - name: Check line endings and encoding
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: bash scripts/check-line-endings.sh

      # PINNED, not the distro default. CI run #11 failed on an SC2218 that the local
      # shellcheck did not report: the two versions disagreed about a duplicated function
      # definition, which meant "verified locally before pushing" had quietly stopped
      # guaranteeing anything. Both sides now run the same binary, and the version is
      # printed so a future divergence is visible in the log rather than inferred from a
      # surprise failure.
      - name: Install shellcheck
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$url" | tar -xJ --strip-components=1 -C "$HOME/.local/bin" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          chmod +x "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shellcheck" --version

      # Deterministic, unlike the accident that exposed this. Run #11 was caught only
      # because CI and the maintainer had different shellcheck builds; 0.11.0 reports
      # nothing for a duplicated function even when SC2218 is requested by name. Now that
      # both sides run the same pinned binary, that accident cannot repeat, so the defect
      # it happened to reveal is checked for on purpose instead.
      - name: No duplicate function definitions
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bash scripts/check-duplicate-functions.sh

      # -x follows `source=` directives so ShellCheck can see that bootmodes and
      # file_permissions are assigned by iso/profiledef.sh. -P anchors the search path
      # to the repository root, which is what those directives are written against, and
      # makes the result independent of the working directory.
      #
      # Resolving the source is preferred over blanket disable=SC2034,SC2154 directives:
      # a disable would also hide a genuine unassigned variable in the same file, whereas
      # this keeps every real finding detectable.
      - name: Shellcheck
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          root="$(git rev-parse --show-toplevel)"
          mapfile -t files < <(git ls-files "*.sh")
          shellcheck --version | grep version
          echo "checking ${#files[@]} shell script(s) with external sources enabled"
          shellcheck -x -P "$root" --severity=warning "${files[@]}"

      # WARNING, not a failure, and that is deliberate for Phase 1.
      #
      # The ISO profile still inherits boot loader configuration from upstream releng,
      # so Arch branding is EXPECTED to be present right now. De-branding is Phase 2
      # work. Gating Phase 1 on a Phase 2 criterion blocked the build without testing
      # any of Phase 1's actual acceptance criteria, which is worse than not checking.
      #
      # This becomes a hard failure as part of the Phase 2 acceptance criteria. That
      # promotion is recorded in docs/ROADMAP.md so it cannot quietly stay a warning.
      #
      # When promoting it, ALSO narrow the scope. As written this scan matches source
      # comments, and it currently trips on the phrase "Arch Linux Archive" - the real
      # name of the upstream service Obelisk pins its mirror to, which we will reference
      # forever and must not rename. The Phase 2 version has to target user-visible
      # strings rather than any occurrence of the word.
      # This step exists because CI run #3 died in 14 seconds with no message at all.
      # The cause was that iso/profiledef.sh could not be sourced on its own:
      # file_permissions is an associative array literal, and without a prior
      # `declare -A` bash evaluates ["/etc/shadow"] as arithmetic and errors.
      #
      # `bash -n` does NOT catch this. It parses cleanly and only fails when executed,
      # so syntax checking gave false confidence. Sourcing it for real is the only
      # check that would have caught it, and it costs milliseconds.
      - name: Execute iso/profiledef.sh and assert it declares a bootable profile
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Sourced with NO pre-declaration on purpose. mkarchiso happens to declare
          # file_permissions associative in its own scope before sourcing, so a profile
          # missing `declare -A` still works for mkarchiso while being unsourceable by
          # everything else -- which is exactly the trap that cost CI run #3. The first
          # version of THIS check pre-declared the array too, and therefore passed
          # against the known-broken file. It has to prove self-sufficiency.
          out="$(
            set -euo pipefail
            . iso/profiledef.sh
            echo "bootmodes=${bootmodes[*]:-}"
            echo "file_permissions=${#file_permissions[@]}"
            echo "iso_name=${iso_name:-}"
            echo "install_dir=${install_dir:-}"
          )"
          echo "$out"
          grep -q '^bootmodes=..*'   <<<"$out" || { echo "::error::profiledef.sh declares no bootmodes"; exit 1; }
          grep -q '^iso_name=..*'    <<<"$out" || { echo "::error::profiledef.sh declares no iso_name"; exit 1; }
          grep -q '^install_dir=..*' <<<"$out" || { echo "::error::profiledef.sh declares no install_dir"; exit 1; }
          [ "$(sed -n 's/^file_permissions=//p' <<<"$out")" -gt 0 ] || { echo "::error::file_permissions is empty"; exit 1; }
          echo "profiledef.sh executes and declares a usable profile"

      - name: Scan for Arch branding (warning during Phase 1)
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          matches="$(git ls-files 'iso/airootfs/**' | xargs -r grep -Hni 'arch linux' || true)"
          if [ -n "$matches" ]; then
            echo "::warning title=Arch branding present in iso/airootfs::De-branding is Phase 2 work. This check becomes a hard failure in Phase 2 (see docs/ROADMAP.md and docs/LEGAL.md)."
            echo "$matches"
          else
            echo "no Arch branding in iso/airootfs"
          fi

  # ---------------------------------------------------------------------------
  # Gate 2: build the ISO and prove it boots.
  # ---------------------------------------------------------------------------
  build:
    name: build ISO and boot it
    needs: lint
    runs-on: ubuntu-latest
    # Budget, from measurements rather than guesswork:
    #   pacman in the container      ~5m
    #   mkarchiso                    ~5m   (run #8 measured 5m10s)
    #   ISO upload, ~1 GB            ~5m
    #   boot test, 2 x 20m cap      ~40m
    #                               -----
    #                                55m, so 75 gives sane headroom without
    #                                letting a hang burn two hours again.
    #
    # Run #9 hung for 2h06m under the previous 120m cap. A cap that generous is not a
    # guardrail. Step-level timeouts below narrow it further, so a hang names itself
    # instead of only failing the job.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      # An ISO build needs far more room than a stock runner leaves free. Reclaim it on
      # the HOST before starting the container, which is why this workflow runs docker
      # by hand instead of using the job-level `container:` key.
      - name: Free disk space
        timeout-minutes: 5
        run: |
          set -euo pipefail
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "after:"; df -h /
        env:
          AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache

      # Reproducible ISO version and label: derived from the commit, not from the clock.
      # Affects only reproducible ISO naming; profiledef.sh falls back to the current
      # time when it is unset. Tolerant on purpose, so it cannot block a build.
      - name: Compute SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct || true)" >> "$GITHUB_ENV"

      - name: Create config.env
        run: |
          set -euo pipefail
          cp config.env.example config.env
          # Values that are genuinely maintainer-supplied stay empty here. The build is
          # designed to succeed without them: no fake URL or key is ever substituted.
          {
            echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
            echo "OBELISK_URL=${OBELISK_URL}"
          } >> config.env
          echo "--- effective config (secrets are never printed) ---"
          grep -v '^#' config.env | grep -v '^$' || true
        env:
          # Empty unless the maintainer sets the repository variable. Omitted, not faked.
          OBELISK_URL: ${{ vars.OBELISK_URL }}

      # The container is privileged because mkarchiso must create device nodes and mount
      # loop devices. The build TOOLING (archiso, qemu) comes from Arch's current
      # repositories; the ISO CONTENTS come from the pinned Arch Linux Archive snapshot
      # configured in iso/pacman.conf. Those are deliberately two different things.
      - name: Build ISO in a privileged Arch container
        timeout-minutes: 30
        id: build
        run: |
          set -euo pipefail
          # stdin closed: any command that decides to prompt gets EOF and fails fast,
          # instead of waiting forever on a terminal that does not exist.
          docker run --rm --privileged \
            -v "${PWD}:/build" -w /build \
            -e SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            archlinux:latest bash -euo pipefail -c '
              # Complete and explicit, taken from the archiso 89 package metadata rather than
              # discovered one failed build at a time. archiso pulls its REQUIRED deps in by
              # itself; the ones that bite are its OPTIONAL deps, which pacman will not install:
              #   grub      "for grub support in the ISO"  - the uefi.grub bootmode needs it,
              #                                              which is what broke CI run #5
              #   edk2-ovmf "for emulating UEFI"           - scripts/test-qemu.sh needs it
              # The required deps are listed too, so this line documents the whole build surface.
              pacman -Syu --noconfirm --needed \
                archiso grub edk2-ovmf qemu-base arch-install-scripts dosfstools e2fsprogs erofs-utils libarchive libisoburn mtools squashfs-tools curl rsync
              # mkarchiso runs as root and creates out/ and work/ owned by root. Every
              # later step in this job is unprivileged, so without this they cannot even
              # write out/iso-size.txt -- which is exactly what broke run #7.
              #
              # An EXIT trap rather than a trailing command: ownership must be restored
              # even when the build fails, or the diagnostics upload cannot read what it
              # is meant to collect. The uid:gid is taken from the mounted workspace
              # rather than hard-coded, so it follows whatever user the runner uses.
              _restore_owner() { chown -R "$(stat -c %u:%g /build)" /build/out /build/work 2>/dev/null || true; }
              trap _restore_owner EXIT
              bash scripts/build-iso.sh --serial-console
            ' </dev/null

      # Uploaded here, directly after mkarchiso and BEFORE the boot test, with
      # if: always(). The ISO is the expensive output of this workflow -- roughly
      # 16 minutes of build time -- and a failing boot test is precisely when the
      # maintainer most needs the image in hand to reproduce the failure on real
      # hardware. Gating the upload on a later step meant a perfectly good ISO was
      # discarded with the runner. The boot test still fails the job; it just no
      # longer decides whether the artifact survives.

      # Measured immediately after the build and written to the run summary, so the
      # first real number against the 3.5 GB ceiling is visible without digging
      # through logs, and survives a failing boot test. Recorded per release in
      # docs/PERFORMANCE.md -- see the rule there about which numbers CI may publish.
      - name: Measure and record ISO size
        timeout-minutes: 5
        if: always()
        # Pure bookkeeping. GitHub runs `run:` steps under `bash -e`, so a failing
        # command here aborts the step; continue-on-error stops that from failing the
        # job or skipping anything downstream. In run #7 this step could not write into
        # a root-owned out/ and took the entire boot test down with it -- the real test,
        # skipped by a step that only measures a file.
        continue-on-error: true
        run: |
          set -uo pipefail
          iso="$(find out -maxdepth 1 -name "*.iso" -print -quit 2>/dev/null || true)"
          if [ -z "$iso" ]; then
            echo "no ISO produced"
            echo "### ISO: not produced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bytes="$(stat -c %s "$iso")"
          mib=$(( bytes / 1024 / 1024 ))
          ceiling=3584
          pct=$(( mib * 100 / ceiling ))
          {
            echo "iso_path=$iso"
            echo "iso_bytes=$bytes"
            echo "iso_mib=$mib"
            echo "ceiling_mib=$ceiling"
            echo "headroom_mib=$(( ceiling - mib ))"
            echo "commit=${GITHUB_SHA}"
            echo "archive_snapshot=${OBELISK_ARCHIVE_DATE:-unset}"
          } | tee out/iso-size.txt || true
          {
            echo "## ISO size"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| size | ${mib} MiB (${bytes} bytes) |"
            echo "| ceiling | ${ceiling} MiB |"
            echo "| used | ${pct}% |"
            echo "| headroom | $(( ceiling - mib )) MiB |"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh out/*.iso
          df -h /
      - name: Upload ISO
        timeout-minutes: 20
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: obelisk-iso
          path: |
            out/*.iso
            out/*.iso.sha256
            out/iso-size.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0   # an ISO is already compressed; recompressing wastes time

      # Gated on the BUILD step specifically, not on overall job status. Anything that
      # is not mkarchiso -- measuring, uploading, summarising -- must be incapable of
      # preventing the real test from running.
      - name: Boot the ISO under BIOS and UEFI
        timeout-minutes: 50
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/build" -w /build \
            -e CI=true \
            archlinux:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed qemu-base edk2-ovmf
              # No /dev/kvm on GitHub-hosted runners: this is TCG emulation, so the
              # timeout is generous and the timings are NOT performance measurements.
              _restore_owner() { chown -R "$(stat -c %u:%g /build)" /build/out 2>/dev/null || true; }
              trap _restore_owner EXIT
              echo "--- accelerator availability on this runner ---"
              if [ -e /dev/kvm ]; then ls -l /dev/kvm; else echo "no /dev/kvm: TCG software emulation only"; fi
              bash scripts/test-qemu.sh --mode both --timeout 1200
            ' </dev/null

      - name: Upload build diagnostics
        timeout-minutes: 10
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: obelisk-build-diagnostics
          path: |
            out/profile-manifest.txt
            out/iso-size.txt
            out/kernel-cmdline.txt
            out/qemu/

          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Publish: only for v* tags, and only after the ISO has been proven to boot.
  # ---------------------------------------------------------------------------
  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: obelisk-iso
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.iso
            release/*.iso.sha256
          draft: true       # a human confirms before an ISO is published to the world
          generate_release_notes: true
