#
# Obelisk system pacman configuration.
#
# This is the pacman.conf that ships INSIDE the image and ends up on the installed
# system. It is deliberately separate from iso/pacman.conf, which only configures the
# build host while it populates the image.
#
# Repository order is load-bearing and must never be reordered casually: core and
# extra come from Arch first, and any Obelisk repository comes LAST so that an Obelisk
# package can never shadow an upstream one. scripts/lint.sh enforces the ordering.
#
# The Arch repositories are pinned to a dated Arch Linux Archive snapshot, which is how
# Obelisk stays 7-14 days behind Arch without operating a mirror (decision D2 in
# docs/ARCHITECTURE.md). scripts/build-iso.sh substitutes the date at build time.

[options]
HoldPkg          = pacman glibc
Architecture     = auto
CheckSpace
Color
ILoveCandy
ParallelDownloads = 5
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://archive.archlinux.org/repos/@ARCHIVE_DATE_PATH@/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/@ARCHIVE_DATE_PATH@/$repo/os/$arch

[multilib]
Server = https://archive.archlinux.org/repos/@ARCHIVE_DATE_PATH@/$repo/os/$arch

# [obelisk] is appended here by scripts/build-iso.sh once the repository is published.
# It is always last. See docs/ARCHITECTURE.md section 7.
